name: Roku package checks

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/brightscript/package-lock.json
      - run: npm ci --prefix tools/brightscript --ignore-scripts
      - run: node tools/brs_lint.cjs
      - run: SILO_REQUIRE_BRS=1 python3 tools/run_tests.py -j 4
      - run: python3 tools/package.py
